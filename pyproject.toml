[project]
name = "tsyfwd"
version = "0.1.0"
description = "Daily expected-return dashboard for US Treasuries from a frozen forecasting model"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no system IANA tz database
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsyfwd"]
